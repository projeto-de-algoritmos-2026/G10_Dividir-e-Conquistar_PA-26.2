name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "3.x" resolve para a versão estável mais recente, sem ficar defasada.
        python-version: ["3.11", "3.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar o pacote em modo editável com extras de desenvolvimento
        run: python -m pip install -e ".[dev]"

      - name: Suíte pytest
        run: python -m pytest -q --ignore=tests/browser

      - name: Comandos da demonstração documentados no README
        run: |
          python -m ranklab --info
          python -m ranklab --help
          python -m ranklab load-matrix examples/matriz.json
          python -m ranklab load-ranking examples/ranking.json
          python -m ranklab load-ranking examples/ranking-operacional.json
          python -m ranklab compare-rankings examples/ranking.json examples/ranking-operacional.json
          python -m ranklab closest-pair examples/matriz.json qualidade prazo_dias
          python -m ranklab select examples/valores-qualidade.json --percentile 50
          python -m ranklab compare-weights examples/matriz.json --base-weights examples/pesos.json --changed-weights examples/pesos-alterados-muda.json
          python -m ranklab audit-report examples/matriz.json \
            --first-ranking examples/ranking.json \
            --second-ranking examples/ranking-operacional.json \
            --base-weights examples/pesos.json \
            --changed-weights examples/pesos-alterados-muda.json \
            --closest-criteria qualidade prazo_dias \
            --selection-criterion qualidade --percentile 50 \
            --output relatorio.json

      - name: Servidor da demonstração responde com o relatório
        run: |
          python -m ranklab serve --report relatorio.json --port 8765 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --silent --show-error --fail --retry 10 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:8765/api/report --output resposta.json
          python -c "import json; assert json.load(open('resposta.json', encoding='utf-8'))['analyses']"

      - name: Ruff informativo, sem reformatação em massa
        # Avaliação em docs/ci-e-qualidade.md: os achados aparecem como aviso e
        # não deixam o workflow vermelho.
        continue-on-error: true
        run: |
          python -m pip install ruff
          python -m ruff check src tests

  javascript:
    name: Testes JavaScript do visualizador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Funções do relatório e do formulário
        run: |
          node --test tests/web/report.test.mjs
          node --test tests/web/form.test.mjs

  package:
    name: Wheel inclui a interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir e instalar wheel limpa
        run: |
          python -m pip install build
          python -m build --wheel
          python -m pip install dist/ranklab-*.whl
      - name: Conferir a interface empacotada fora do repositório
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from importlib.resources import files

          from ranklab.server import STATIC_FILES

          web = files("ranklab").joinpath("web")
          names = sorted({filename for filename, _ in STATIC_FILES.values()})
          for name in names:
              assert web.joinpath(name).read_bytes(), name
          print("interface empacotada:", ", ".join(names))
          PY

  browser:
    name: Testes de navegador e acessibilidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar extras de navegador
        run: |
          python -m pip install -e ".[browser]"
          python -m playwright install --with-deps chromium
      - name: Fluxos do visualizador e auditoria axe
        run: python -m pytest -q tests/browser
